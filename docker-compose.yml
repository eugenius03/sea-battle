services:
  postgres:
    image: postgres:15.1
    container_name: postgres
    environment:
      POSTGRES_DB: sea_battle_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  backend:
    build:
      dockerfile: Dockerfile
    container_name: sea_battle_backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sea_battle_db
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://localhost:5432/sea_battle_db
      DB_USERNAME: user
      DB_PASSWORD: password

volumes:
  postgres_data:
