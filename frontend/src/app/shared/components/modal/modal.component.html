@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in"
    (click)="closed.emit()"
    (keydown.enter)="closed.emit()"
    tabindex="0"
  >
    <div
      class="relative w-full max-w-lg p-6 sm:p-8 bg-white border-4 border-black shadow-[8px_8px_0px_#000] animate-scale-up text-black"
      (click)="$event.stopPropagation()"
      (keydown.enter)="$event.stopPropagation()"
      tabindex="0"
    >
      @if (showClose()) {
        <button
          type="button"
          (click)="closed.emit()"
          aria-label="Close modal"
          class="absolute top-3 right-3 w-8 h-8 bg-neutral-100 hover:bg-neutral-200 border-2 border-black flex items-center justify-center font-black text-sm cursor-pointer shadow-[2px_2px_0px_#000] active:translate-x-[1px] active:translate-y-[1px] active:shadow-[1px_1px_0px_#000] transition-colors"
        >
          <app-icon name="close" [size]="14"></app-icon>
        </button>
      }

      @if (title()) {
        <div class="flex items-center justify-between pb-4 mb-5 border-b-2 border-black pr-10">
          <h2
            class="text-base sm:text-lg font-black uppercase tracking-wider text-black flex items-center gap-2"
          >
            <span class="w-2.5 h-2.5 bg-black inline-block"></span>
            {{ title() }}
          </h2>
        </div>
      }

      <ng-content></ng-content>
    </div>
  </div>
}
