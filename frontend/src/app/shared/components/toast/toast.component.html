<div
  class="fixed top-4 sm:top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2.5 pointer-events-none w-full max-w-md px-4"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      role="alert"
      class="toast-item pointer-events-auto flex items-center justify-between gap-3 w-full bg-white border-2 border-black shadow-[4px_4px_0px_#000] p-3 text-black text-xs sm:text-sm font-mono font-bold tracking-wider"
    >
      <div class="flex items-center gap-3 min-w-0 flex-1">
        <span
          class="flex-shrink-0 w-7 h-7 flex items-center justify-center shadow-[1px_1px_0px_#000]"
          [class]="getBadgeClasses(toast.type)"
        >
          <app-icon [name]="getIconName(toast.type)" [size]="16"></app-icon>
        </span>
        <span class="break-words uppercase leading-tight">{{ toast.message }}</span>
      </div>
      <button
        type="button"
        (click)="toastService.dismiss(toast.id)"
        aria-label="Dismiss notification"
        class="flex-shrink-0 w-6 h-6 border-2 border-black bg-neutral-100 hover:bg-neutral-200 text-black flex items-center justify-center cursor-pointer shadow-[2px_2px_0px_#000] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none transition-none"
      >
        <app-icon name="close" [size]="12"></app-icon>
      </button>
    </div>
  }
</div>
