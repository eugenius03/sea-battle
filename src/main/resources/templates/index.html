<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg-1: #f6f2ea;
            --bg-2: #dff2f1;
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #0ea5a4;
            --accent-strong: #0f766e;
            --panel: #ffffff;
            --line: #e2e8f0;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
            --radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top left, #ffffff 0%, var(--bg-1) 40%, var(--bg-2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
        }

        .container {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 42px;
            box-shadow: var(--shadow);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--line);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            top: -70px;
            right: -70px;
            background: radial-gradient(circle, rgba(14, 165, 164, 0.25), transparent 70%);
        }

        h1 {
            text-align: center;
            color: var(--ink);
            margin-bottom: 26px;
            font-family: "Space Grotesk", "Manrope", sans-serif;
            font-size: 34px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(14, 165, 164, 0.15);
        }

        button {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.25);
        }

        .info {
            background-color: #f0fdfa;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #0f766e;
            font-size: 14px;
            border: 1px solid #ccfbf1;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🚢 Sea Battle Game</h1>

    <div class="info">
        <strong>Quick Start:</strong><br>
        Enter your Match ID and Player ID to join the game, or create a new match.
    </div>

    <!-- Username field for guests (hidden if logged in) -->
    <div id="guestUsernameField" style="display: none; margin-bottom: 20px;">
        <div class="form-group">
            <label for="guestUsername">Your Username:</label>
            <input type="text" id="guestUsername" name="guestUsername" placeholder="Enter your username" minlength="3"
                   maxlength="20">
            <div id="usernameError" style="color: #e74c3c; font-size: 13px; margin-top: 5px; display: none;"></div>
        </div>
    </div>

    <!-- Create Match Form -->
    <form id="createMatchForm" style="margin-bottom: 30px;">
        <button type="submit" style="background-color: #27ae60;">Create New Match</button>
    </form>

    <div style="text-align: center; margin: 20px 0; color: #999; font-weight: bold;">
        OR
    </div>

    <!-- Join Match Form -->
    <form id="joinForm">
        <h3 style="text-align: center; margin-bottom: 15px; color: #555;">Join Existing Match</h3>
        <div class="form-group">
            <label for="inviteToken">Invite Code:</label>
            <input type="text" id="inviteToken" name="inviteToken" placeholder="Enter invite code" required>
        </div>

        <button type="submit">Join Game</button>
    </form>
</div>

<script>
    // Check if user is logged in by looking for accessToken cookie
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    // Parse JWT token to get username
    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    // Check authentication status
    const accessToken = getCookie('accessToken');
    let isLoggedIn = false;
    let currentUsername = null;

    if (accessToken) {
        const payload = parseJwt(accessToken);
        if (payload && payload.sub) {
            isLoggedIn = true;
            currentUsername = payload.sub;
        }
    }

    // Show username field only for guests
    if (!isLoggedIn) {
        document.getElementById('guestUsernameField').style.display = 'block';
        document.getElementById('guestUsername').required = true;
    }

    // Handle create match form
    document.getElementById('createMatchForm').addEventListener('submit', function (e) {
        e.preventDefault();

        if (isLoggedIn) {
            // Logged-in user: use existing POST form
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/game';
            document.body.appendChild(form);
            form.submit();
        } else {
            // Guest user: validate username and redirect
            const username = document.getElementById('guestUsername').value.trim();
            const errorDiv = document.getElementById('usernameError');

            if (username.length < 3) {
                errorDiv.textContent = 'Username must be at least 3 characters';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/game';
            document.body.appendChild(form);
            form.submit();
        }
    });

    // Handle join match form
    document.getElementById('joinForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const inviteToken = document.getElementById('inviteToken').value;

        if (!isLoggedIn) {
            // Validate username for guests
            const username = document.getElementById('guestUsername').value.trim();
            const errorDiv = document.getElementById('usernameError');

            if (username.length < 3) {
                errorDiv.textContent = 'Username must be at least 3 characters';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
        }

        // Redirect to join page
        window.location.href = `/game/join/${inviteToken}`;
    });

    // Clear error on input
    document.getElementById('guestUsername')?.addEventListener('input', function () {
        document.getElementById('usernameError').style.display = 'none';
    });
</script>
</body>
</html>
