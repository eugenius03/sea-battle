<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="container">
    <h1>🚢 Sea Battle Game</h1>

    <div class="info">
        <strong>Quick Start:</strong><br>
        Enter your Match ID and Player ID to join the game, or create a new match.
    </div>

    <!-- Username field for guests (hidden if logged in) -->
    <div id="guestUsernameField">
        <div class="form-group">
            <label for="guestUsername">Your Username:</label>
            <input type="text" id="guestUsername" name="guestUsername" placeholder="Enter your username" minlength="3"
                   maxlength="20">
            <div id="usernameError" style="display: none;"></div>
        </div>
    </div>

    <!-- Create Match Form -->
    <form id="createMatchForm" style="margin-bottom: 30px;">
        <button type="submit" style="background: linear-gradient(135deg, #27ae60, #1e8449);">Create New Match</button>
    </form>

    <div class="or-divider">OR</div>

    <!-- Join Match Form -->
    <form id="joinForm">
        <h3>Join Existing Match</h3>
        <div class="form-group">
            <label for="inviteToken">Invite Code:</label>
            <input type="text" id="inviteToken" name="inviteToken" placeholder="Enter invite code" required>
        </div>

        <button type="submit">Join Game</button>
    </form>
</div>

<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
