<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>
<div class="container">
    <div class="form-header">
        <h1>🚢 Sea Battle</h1>
    </div>
    <div class="subtitle">Create your account to start playing</div>

    <div th:if="${success}" class="success-message">
        ✅ Registration successful!
        <a href="/login">Click here to login</a>
    </div>

    <form th:action="@{/register}" th:object="${userRegistrationRequest}" method="post">
        <div class="form-group">
            <label for="username">Username <span class="required">*</span></label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   th:classappend="${#fields.hasErrors('username')} ? 'error' : ''"
                   placeholder="Enter your username"
                   required>
            <span th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                   placeholder="Enter your email"
            >
            <span th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"
                   placeholder="Enter your password"
                   required>
            <div class="password-requirements">
                Must be at least 6 characters long
            </div>
            <span th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                  class="error-message"></span>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="auth-link">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
