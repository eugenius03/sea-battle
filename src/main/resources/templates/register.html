<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg-1: #f6f2ea;
            --bg-2: #dff2f1;
            --ink: #0f172a;
            --muted: #64748b;
            --accent: #0ea5a4;
            --accent-strong: #0f766e;
            --panel: #ffffff;
            --line: #e2e8f0;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.16);
            --radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Manrope", "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(circle at top left, #ffffff 0%, var(--bg-1) 40%, var(--bg-2) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink);
        }

        .container {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 42px;
            box-shadow: var(--shadow);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--line);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            top: -80px;
            right: -80px;
            background: radial-gradient(circle, rgba(14, 165, 164, 0.25), transparent 70%);
        }

        h1 {
            text-align: center;
            color: var(--ink);
            margin-bottom: 10px;
            font-family: "Space Grotesk", "Manrope", sans-serif;
            font-size: 34px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(14, 165, 164, 0.15);
        }

        input.error {
            border-color: #f97316;
        }

        .error-message {
            color: #c2410c;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(15, 118, 110, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        .success-message {
            background-color: #ecfdf5;
            color: #166534;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 700;
            border: 1px solid #bbf7d0;
        }

        .success-message a {
            color: #0f766e;
            text-decoration: none;
            font-weight: 700;
        }

        .success-message a:hover {
            text-decoration: underline;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .login-link a {
            color: var(--accent-strong);
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .info {
            background-color: #f0fdfa;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #0f766e;
            font-size: 14px;
            border: 1px solid #ccfbf1;
        }

        .form-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .ship-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .password-requirements {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }

        .required {
            color: #f97316;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-header">
        <h1>🚢 Sea Battle</h1>
    </div>
    <div class="subtitle">Create your account to start playing</div>

    <div th:if="${success}" class="success-message">
        ✅ Registration successful!
        <a href="/login">Click here to login</a>
    </div>

    <form th:action="@{/register}" th:object="${userRegistrationRequest}" method="post">
        <div class="form-group">
            <label for="username">Username <span class="required">*</span></label>
            <input type="text"
                   id="username"
                   th:field="*{username}"
                   th:classappend="${#fields.hasErrors('username')} ? 'error' : ''"
                   placeholder="Enter your username"
                   required>
            <span th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                   placeholder="Enter your email"
            >
            <span th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                  class="error-message"></span>
        </div>

        <div class="form-group">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password"
                   id="password"
                   th:field="*{password}"
                   th:classappend="${#fields.hasErrors('password')} ? 'error' : ''"
                   placeholder="Enter your password"
                   required>
            <div class="password-requirements">
                Must be at least 6 characters long
            </div>
            <span th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                  class="error-message"></span>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="/login">Login here</a>
    </div>
</div>

<script>
    // Form validation enhancement
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const inputs = form.querySelectorAll('input[required]');

        inputs.forEach(input => {
            input.addEventListener('blur', function () {
                if (this.value.trim() === '') {
                    this.classList.add('error');
                } else {
                    this.classList.remove('error');
                }
            });

            input.addEventListener('input', function () {
                if (this.value.trim() !== '') {
                    this.classList.remove('error');
                }
            });
        });

        // Password strength indicator
        const passwordInput = document.getElementById('password');
        passwordInput.addEventListener('input', function () {
            const requirements = this.nextElementSibling;
            if (this.value.length >= 6) {
                requirements.style.color = '#4caf50';
            } else {
                requirements.style.color = '#888';
            }
        });
    });
</script>
</body>
</html>
