<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Battle - Register</title>
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/register.css">
</head>
<body class="has-navbar">

<div th:replace="~{fragments/navbar :: navbar('register')}"></div>

<div class="page-center">
    <div class="auth-card">
        <div class="form-header">
            <span class="logo-lock">
                <img src="/img/logo.svg" alt="">
                <span class="wm">Sea Battle</span>
            </span>
        </div>
        <div class="subtitle">Create your account to start playing</div>

        <div id="messageArea"></div>

        <form id="registerForm">
            <div class="field">
                <label for="username">Username <span class="req">*</span></label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <span class="error-message" id="usernameError"></span>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="field">
                <label for="password">Password <span class="req">*</span></label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <div class="password-requirements">Must be at least 6 characters long</div>
                <span class="error-message" id="passwordError"></span>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
