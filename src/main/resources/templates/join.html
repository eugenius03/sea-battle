<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Game - Sea Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/join.css">
</head>
<body>
<div class="container">
    <h1>🚢 Join Sea Battle</h1>
    <div class="subtitle">Join the game and start playing!</div>

    <div class="info">
        <strong>Invite Code:</strong> <span th:text="${inviteToken}">ABC12345</span>
    </div>

    <!-- Guest Join Form -->
    <form id="guestForm">
        <h3>Join as Guest</h3>

        <div class="form-group">
            <label for="guestUsername">Choose a Username <span class="required">*</span></label>
            <input type="text"
                   id="guestUsername"
                   placeholder="Enter your username"
                   minlength="3"
                   maxlength="20"
                   required>
            <div id="guestError" class="error-message" style="display: none;"></div>
        </div>

        <button type="submit">Join Game as Guest</button>
    </form>

    <div class="divider">OR</div>

    <!-- Login Form -->
    <div class="login-section">
        <p>Already have an account?</p>
        <form th:action="@{/login}" method="get" style="display: inline;">
            <input type="hidden" name="redirect" th:value="${'/join/' + inviteToken}">
            <button type="submit" class="secondary-btn">Login to Join</button>
        </form>
    </div>

    <div class="auth-link">
        Don't have an account? <a href="/register">Register here</a>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const inviteToken = /*[[${inviteToken}]]*/ 'token123';
    /*]]>*/
</script>
<script src="/js/common.js"></script>
<script src="/js/join.js"></script>
</body>
</html>
